<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WinGo 24/7 Cloud Bot | Voroa Mumbai Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-primary: #6366f1;
      --brand-green: #10b981;
      --brand-red: #ef4444;
      --brand-purple: #8b5cf6;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px -15px rgba(0,0,0,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    /* TOP NAVIGATION BAR */
    .top-bar {
      min-height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      z-index: 100;
      position: relative;
      flex-wrap: wrap;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 16px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    /* DIRECT LOGIN BAR */
    .login-box-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .input-field {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 9px;
      padding: 0 10px;
      height: 36px;
      transition: all 0.2s;
    }
    .input-field:focus-within {
      background: #fff;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .country-prefix {
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
      margin-right: 6px;
      border-right: 1px solid #cbd5e1;
      padding-right: 6px;
    }
    .top-input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      width: 130px;
    }
    .btn-connect {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 0 14px;
      height: 36px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
      transition: all 0.15s;
    }
    .btn-connect:hover { transform: translateY(-1px); }
    .btn-token-toggle {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #64748b;
      border-radius: 8px;
      padding: 0 10px;
      height: 36px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .server-status-pill {
      font-size: 11px;
      font-weight: 800;
      color: #16a34a;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      padding: 5px 12px;
      border-radius: 999px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* GAME VIEWPORT */
    .game-viewport {
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background: #e2e8f0;
    }
    iframe#game-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* TOP-RIGHT DOCKED LIGHT HUD */
    #floating-hud {
      position: absolute;
      top: 14px;
      right: 18px;
      width: 320px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      z-index: 99999;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #floating-hud.minimized {
      width: 190px;
      height: 46px;
    }
    .hud-head {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
    }
    .badge-pill.live {
      background: #dcfce7;
      color: #16a34a;
    }
    .btn-toggle-min {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
    }
    .btn-toggle-min:hover { background: #f1f5f9; color: #0f172a; }

    .hud-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
    }
    .box-label {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .box-val {
      font-size: 16px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #0f172a;
    }
    .box-val.green { color: #16a34a; }
    .box-val.purple { color: #7c3aed; }

    /* 4-6 MIN DELAY BANNER */
    .delay-card {
      background: linear-gradient(135deg, #ede9fe 0%, #fae8ff 100%);
      border: 1px solid #ddd6fe;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delay-text {
      font-size: 10px;
      font-weight: 800;
      color: #6d28d9;
      text-transform: uppercase;
    }
    .delay-clock {
      font-size: 18px;
      font-weight: 900;
      color: #5b21b6;
      font-family: 'JetBrains Mono', monospace;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }
    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .form-label {
      font-size: 10px;
      font-weight: 700;
      color: #475569;
    }
    .form-input {
      background: #fff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
    }
    .form-input:focus { border-color: var(--brand-primary); }

    .tag-note {
      font-size: 9.5px;
      color: #475569;
      font-weight: 600;
      text-align: center;
      background: #f1f5f9;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .btn-action {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      color: #fff;
    }
    .btn-start {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-start:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45); }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }

    .log-box {
      font-size: 10px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
      max-height: 85px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 8px;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      #floating-hud {
        width: calc(100vw - 24px);
        right: 12px;
        top: 68px;
      }
      .top-bar {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="brand-wrap">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">WinGo 24/7 Cloud Bot</div>
    </div>

    <!-- DIRECT RAXI LOGIN FORM -->
    <div class="login-box-wrap" id="login-form-wrap">
      <div class="input-field">
        <span class="country-prefix">+91</span>
        <input type="tel" class="top-input" id="raxi-mobile" placeholder="Mobile Number" maxlength="10">
      </div>
      <div class="input-field">
        <input type="password" class="top-input" id="raxi-pwd" placeholder="Raxi Password">
      </div>
      <button class="btn-connect" id="btn-login-submit" onclick="loginRaxiAccount()">⚡ Login & Start 24/7 Bot</button>
      <button class="btn-token-toggle" onclick="toggleTokenInput()" title="Or paste token manually">🔑 Token</button>
    </div>

    <div class="login-box-wrap" id="token-form-wrap" style="display: none;">
      <div class="input-field" style="width: 250px;">
        <input type="password" class="top-input" style="width: 100%;" id="auth-token-input" placeholder="Paste ar_token directly">
      </div>
      <button class="btn-connect" onclick="connectAccount()">Connect</button>
      <button class="btn-token-toggle" onclick="toggleTokenInput()">Back</button>
    </div>

    <div class="server-status-pill">
      <span class="status-dot"></span>
      <span id="conn-label">Voroa Mumbai Server</span>
    </div>
  </div>

  <!-- EMBEDDED GAME VIEWPORT -->
  <div class="game-viewport">
    <iframe id="game-frame" src="https://raxi1.com/#/"></iframe>

    <!-- TOP-RIGHT DOCKED LIGHT HUD (SYNCED WITH VOROA SERVER) -->
    <div id="floating-hud">
      <div class="hud-head">
        <div class="hud-title">
          <span>⚡ WinGo Real Bot</span>
          <span class="badge-pill" id="hud-pill">OFFLINE</span>
        </div>
        <div class="btn-toggle-min" id="btn-min" onclick="toggleMinimize()" title="Minimize / Open">−</div>
      </div>

      <div class="hud-body" id="hud-content">
        <div class="hud-grid">
          <div class="box">
            <span class="box-label">Real Balance</span>
            <span class="box-val green" id="hud-bal">₹1,000.77</span>
          </div>
          <div class="box">
            <span class="box-label">Next Stake</span>
            <span class="box-val purple" id="hud-stake">₹10.00</span>
          </div>
        </div>

        <!-- 4-6 MIN DELAY BANNER -->
        <div class="delay-card" id="delay-card" style="display: none;">
          <div>
            <div class="delay-text">⏳ 4–6m Delay Active</div>
            <div style="font-size: 9.5px; color: #6d28d9;">Waiting before next Martingale bet</div>
          </div>
          <div class="delay-clock" id="delay-clock">04:30</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Base Bet (₹)</label>
            <input type="number" class="form-input" id="in-base-bet" value="10" step="5">
          </div>
          <div class="form-group">
            <label class="form-label">Take Profit (₹)</label>
            <input type="number" class="form-input" id="in-target" value="3500" step="100">
          </div>
        </div>

        <div class="tag-note">
          🛡️ Stop-Loss: <b>NONE</b> | <b>First Bet Immediate</b> ➔ 4–6m RNG Delay
        </div>

        <button class="btn-action btn-start" id="btn-action" onclick="toggleCloudBot()">▶ START 24/7 AUTO-BET</button>
        <div class="log-box" id="log-console">Ready to connect on Voroa Mumbai Server...</div>
      </div>
    </div>
  </div>

  <script>
    let isMin = false;
    function toggleMinimize() {
      isMin = !isMin;
      const hud = document.getElementById('floating-hud');
      const btn = document.getElementById('btn-min');
      const body = document.getElementById('hud-content');
      hud.classList.toggle('minimized', isMin);
      body.style.display = isMin ? 'none' : 'flex';
      btn.innerText = isMin ? '+' : '−';
    }

    function toggleTokenInput() {
      const loginWrap = document.getElementById('login-form-wrap');
      const tokenWrap = document.getElementById('token-form-wrap');
      if (loginWrap.style.display === 'none') {
        loginWrap.style.display = 'flex';
        tokenWrap.style.display = 'none';
      } else {
        loginWrap.style.display = 'none';
        tokenWrap.style.display = 'flex';
      }
    }

    let isBotRunning = false;

    // DIRECT 1-CLICK LOGIN WITH MOBILE & PASSWORD
    async function loginRaxiAccount() {
      const mobile = document.getElementById('raxi-mobile').value.trim();
      const pwd = document.getElementById('raxi-pwd').value.trim();
      if (!mobile || !pwd) {
        alert('Please enter your Raxi Mobile Number and Password!');
        return;
      }
      const btn = document.getElementById('btn-login-submit');
      const oldText = btn.innerText;
      btn.innerText = '⏳ Connecting...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mobile: mobile,
            password: pwd,
            base_bet: parseFloat(document.getElementById('in-base-bet').value) || 10,
            take_profit: parseFloat(document.getElementById('in-target').value) || 3500,
            game_mode: '30S'
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(`🎉 CONNECTED REAL ACCOUNT!\n\nLive Wallet Balance: ₹${data.balance.toFixed(2)}\n\n24/7 Cloud Bot is now active on Voroa server! First bet is placing immediately.`);
          document.getElementById('login-form-wrap').innerHTML = `
            <div style="font-size: 12px; font-weight: 800; color: #16a34a; background: #dcfce7; padding: 6px 12px; border-radius: 8px;">
              ✅ Connected: +91 ${mobile.slice(-10)} | Live Bal: ₹${data.balance.toFixed(2)}
            </div>
          `;
          fetchServerStatus();
        } else {
          alert('❌ Login Failed: ' + (data.error || 'Check mobile and password'));
          btn.innerText = oldText;
          btn.disabled = false;
        }
      } catch (e) {
        alert('Connection error: ' + e);
        btn.innerText = oldText;
        btn.disabled = false;
      }
    }

    // Connect Token Manually
    async function connectAccount() {
      const token = document.getElementById('auth-token-input').value.trim();
      if (!token) {
        alert('Please enter your ar_token!');
        return;
      }
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'LIVE',
            game_mode: '30S',
            base_bet: parseFloat(document.getElementById('in-base-bet').value) || 10,
            take_profit: parseFloat(document.getElementById('in-target').value) || 3500,
            initial_bal: 1000.77,
            auth_token: token
          })
        });
        const data = await res.json();
        alert('✅ Real Account Connected to Voroa Server! Now click START.');
        fetchServerStatus();
      } catch(e) {
        alert('Error connecting token: ' + e);
      }
    }

    async function toggleCloudBot() {
      if (isBotRunning) {
        await fetch('/api/stop', { method: 'POST' });
      } else {
        await fetch('/api/start', { method: 'POST' });
      }
      fetchServerStatus();
    }

    // Poll live state from Voroa Mumbai Server every 1s (Syncs across Laptop & Phone!)
    async function fetchServerStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        isBotRunning = data.is_running;

        // Balance & Next Stake
        document.getElementById('hud-bal').innerText = `₹${data.current_balance.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        document.getElementById('hud-stake').innerText = `₹${data.current_bet.toFixed(2)}`;

        // Button & Pill
        const btn = document.getElementById('btn-action');
        const pill = document.getElementById('hud-pill');
        if (data.is_running) {
          btn.className = 'btn-action btn-stop';
          btn.innerText = '⏹ STOP 24/7 AUTO-BET';
          pill.className = 'badge-pill live';
          pill.innerText = 'RUNNING';
        } else {
          btn.className = 'btn-action btn-start';
          btn.innerText = '▶ START 24/7 AUTO-BET';
          pill.className = 'badge-pill';
          pill.innerText = 'OFFLINE';
        }

        // Delay Clock
        const delayCard = document.getElementById('delay-card');
        if (data.status === 'SLEEPING_INTERVAL' && data.countdown_remaining > 0) {
          delayCard.style.display = 'flex';
          const m = Math.floor(data.countdown_remaining / 60);
          const s = data.countdown_remaining % 60;
          document.getElementById('delay-clock').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        } else {
          delayCard.style.display = 'none';
        }

        // Logs
        const logBox = document.getElementById('log-console');
        if (data.logs && data.logs.length > 0) {
          logBox.innerHTML = data.logs.slice(0, 15).map(l => `[${l.timestamp}] ${l.message}`).join('<br>');
        }
      } catch (e) {
        console.error('Status fetch error:', e);
      }
    }

    setInterval(fetchServerStatus, 1000);
    fetchServerStatus();
  </script>
</body>
</html>
